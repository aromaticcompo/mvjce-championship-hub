<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112c24">
  <title>MVJCE — The Championship</title>
  <meta name="description" content="MVJCE inter-department sports: fixtures, schedules and live match scores.">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="courts.css"><link rel="stylesheet" href="compact.css"><link rel="stylesheet" href="simple.css">
</head>
<body>
<a class="skip" href="#fixtures">Skip to matches</a>
<div class="sample-banner">Demo · Fixtures and scores are sample data</div>
<header class="app-header">
  <a class="brand" href="#fixtures" aria-label="MVJCE Championship matches"><span class="brand-icon">M<span>↗</span></span><span>MVJCE<small>INTER-DEPARTMENT SPORTS</small></span></a>
</header>
<main id="home">
<h1 class="sr-only">MVJCE Inter-Department Championship</h1>
<section id="fixtures" class="fixtures-section wrap">
  <div class="section-heading"><h2>Fixtures &amp; scores</h2><span class="section-meta">Times in IST</span></div>
  <div class="match-controls">
    <label class="sport-picker" for="event-filter"><span>Event</span><select id="event-filter"><option value="all">All events</option></select></label>
    <div id="status-filters" class="status-filters" role="group" aria-label="Match status"><button data-status="all" aria-pressed="true">All</button><button data-status="live" aria-pressed="false">Live</button><button data-status="upcoming" aria-pressed="false">Upcoming</button><button data-status="completed" aria-pressed="false">Results</button></div>
    <details class="more-filters" id="more-filters"><summary>More filters <span id="filter-count" hidden></span><span class="filter-chevron" aria-hidden="true">⌄</span></summary><div class="filter-fields"><label for="date-filter">Date<select id="date-filter"><option value="all">All dates</option></select></label><label for="dept-filter">Department<select id="dept-filter"><option value="all">All departments</option></select></label></div></details>
  </div>
  <div class="results-label"><span id="result-count" role="status" aria-live="polite"></span><button class="text-button" id="reset-filters" hidden>Clear filters</button></div>
  <div id="fixture-list" class="fixture-list"></div>
</section>
</main>
<dialog id="match-dialog" aria-labelledby="match-title"><div class="dialog-top"><h2 id="match-title">Match details</h2><span class="dialog-demo">Demo data</span><button id="close-dialog" class="close-button" aria-label="Close match details">✕</button></div><div id="match-detail"></div></dialog>
<script src="data.js"></script><script src="courts.js"></script><script src="app.js"></script>
</body></html>
